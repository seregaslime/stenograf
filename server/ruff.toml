# Линтер сервера. Правила выбраны узко и намеренно.
#
# Цель — ловить настоящие ошибки (неиспользуемая переменная, забытый импорт,
# путаница в именах), а не переписывать проект под чужой вкус. Полный набор
# ruff даёт на этом коде 132 замечания, из которых половина спорит с
# осознанными решениями: BLE001 ругается на широкие except, которые здесь стоят
# специально и с объяснением в комментарии (упавшая подсказка не должна ронять
# встречу), UP045 требует X | None вместо Optional[X] — вкусовщина, ISC004
# запрещает склейку строк в списках, которой набраны промпты.
#
# Расширять этот список стоит по одному правилу и только когда оно поймает
# настоящую ошибку, а не ради полноты.
# 99% строк проекта короче 96, ruff по умолчанию хочет 88. Ставим 110: это не
# «стиль», а потолок, за которым строку уже тяжело читать в дифф-вьюере GitHub.
# Ловить каждую 101-ю — не задача линтера, а повод спорить в ревью.
line-length = 110

[lint]
select = [
    "E",   # ошибки pycodestyle
    "F",   # pyflakes: неиспользуемое, необъявленное, опечатки в именах
    "I",   # порядок импортов
    "W",   # пробелы в конце строк и прочий мусор
]

[lint.per-file-ignores]
# Импорты после sys.path.insert обязаны идти после — иначе app не найдётся.
"scripts/*.py" = ["E402"]
# Первая строка докстринга теста — это его описание в TESTS.md, который
# собирает scripts/test_inventory.py и читает куратор. Это проза, и её длину
# решает читаемость таблицы, а не линтер.
"tests/*.py" = ["E501"]
