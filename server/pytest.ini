[pytest]
testpaths = tests
markers =
    integration: медленные тесты с реальными моделями (ECAPA + синтез голосов macOS). Запуск: pytest -m integration
    e2e: одноразовый живой сервер + WebSocket-клиент, встречи целиком. Запуск: pytest -m e2e
    load: нагрузочные — N параллельных встреч, замер задержки/памяти. Запуск: pytest -m load
addopts = -m "not integration and not e2e and not load"
