# Миграции схемы. Файл нарочно короткий: из ста строк, которые генерирует
# `alembic init`, нам нужна одна — где лежат ревизии.
#
# Адрес базы здесь НЕ задан. Его берёт env.py из app.config: иначе он был бы
# записан в двух местах и однажды разошёлся бы — миграции побежали бы не по той
# базе, по которой работает сервер.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Как читать prepend_sys_path. Без этой строки Alembic предупреждает на каждом
# запуске, что перешёл на старый разбор со splitом по пробелам и запятым.
path_separator = os
