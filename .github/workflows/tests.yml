# Прогон тестов и замер покрытия на чистой машине.
# Смысл: числа в TEST_REPORT.md должен подтверждать не разработчик на своём
# макбуке, а независимый прогон. Артефакты (HTML-покрытие, JUnit XML) можно
# скачать из вкладки Actions и посмотреть глазами.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Сервер (pytest + покрытие)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # torch ставим CPU-сборкой: иначе тянется CUDA и раздувает прогон
      - name: Зависимости
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt -r requirements-dev.txt

      # Линтер идёт до тестов: если сломан импорт или осталась мёртвая
      # переменная, знать об этом лучше за секунду, а не за полторы минуты
      # прогона. Правила выбраны узко — см. server/ruff.toml.
      - name: Линтер
        run: ruff check app scripts tests

      # Медленные уровни (integration/e2e/load) требуют весов моделей и живого
      # сервера — в CI гоняется быстрый набор. Полный прогон: локально с --all.
      - name: Тесты и отчёт
        run: python scripts/test_report.py --out ../TEST_REPORT.ci.md

      - name: Отчёт в сводку Actions
        if: always()
        run: cat ../TEST_REPORT.ci.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: server/reports/htmlcov

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-xml
          path: server/reports/junit

  client:
    name: Клиент (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Линтер ловит то, чего не видит компилятор типов: условно вызванный хук
      # или забытую зависимость эффекта. Предупреждения прогон не валят —
      # красным становится только настоящая ошибка (см. client/eslint.config.mjs).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # Dockerfile ломается тише всего: тесты зелёные, приложение у Сергея
  # работает, а на сервере организации образ не собирается — и выясняется это
  # в худший момент. Поэтому собираем на каждый пул-реквест.
  #
  # По мержу в main образ ещё и публикуется. Раньше он собирался и
  # выбрасывался, а на сервере собирался заново — при 1.8 ГБ доступной памяти,
  # где pip ставит torch. Это была ставка на удачу вместо процедуры
  # обновления; теперь машина тянет готовое.
  image:
    name: Docker-образ сервера
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Логинимся только когда собираемся публиковать: на форках и в
      # пул-реквестах прав на пакеты нет, и шаг упал бы на ровном месте.
      - name: Вход в реестр
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Два тега намеренно: latest — то, что тянет update.sh, sha —
          # то, на что откатываются, когда latest оказался плохим.
          tags: |
            ghcr.io/${{ github.repository_owner }}/stenograf-server:latest
            ghcr.io/${{ github.repository_owner }}/stenograf-server:${{ github.sha }}
          build-args: |
            STENOGRAF_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # «Регрессионный тест» в исходном смысле — после правки прогнать то, что
  # работало раньше. Быстрый набор это уже делает (job server), но уровни
  # integration и e2e не гоняются нигде, кроме макбука и вручную: оба
  # синтезируют голоса командой `say`, и на ubuntu честно скипаются — прогон
  # был бы зелёным, ничего не выполнив. Отсюда macOS-раннер; заодно он arm64,
  # то есть та же архитектура, на которой померен эталон regress.py.
  slow:
    name: Медленные уровни и эталон голоса (macOS)
    runs-on: macos-latest
    # Промах кеша добавляет ~500 МБ загрузки; потолок нужен, чтобы зависший
    # прогон не жёг раннер до отсечки GitHub в 6 часов.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Голоса синтеза — расходный материал этих тестов, и их отсутствие
      # ничего не ломает: integration просто скипнется, а прогон останется
      # зелёным. Зелёный прогон, в котором не выполнилось ничего, хуже
      # красного, поэтому проверяем голоса до всего остального.
      - name: Голоса синтеза на месте
        run: |
          for voice in Milena Daniel Anna; do
            say -v "$voice" -o /tmp/voice-check.wav --data-format=LEI16@16000 проверка || {
              echo "::error::на раннере нет голоса $voice — integration и e2e без него бессмысленны"
              exit 1
            }
          done

      # Веса неизменны, поэтому ключ фиксированный и restore-keys не нужны.
      # restore и save раздельно намеренно: обычный actions/cache сохраняет
      # кеш только при зелёном job, а красный прогон здесь — штатное дело
      # (регрессия по WER, мигнувший e2e). С единым шагом веса качались бы
      # заново на каждой итерации по красному PR, то есть ровно там, где
      # прогонов больше всего.
      - name: Веса моделей из кеша
        id: models
        uses: actions/cache/restore@v4
        with:
          path: server/data/models
          key: models-macos-gigaam-v3_e2e_rnnt-ecapa-v1

      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Регресс идёт первым, потому что он же скачивает GigaAM и ECAPA: без
      # папки server/data/models уровень e2e скипается (test_e2e_live.py:44).
      # shell: bash — ради pipefail. По умолчанию GitHub запускает шаг как
      # `bash -e`, и в конвейере с tee код возврата берётся от tee: упавший
      # regress.py оставил бы шаг зелёным, а проверку — бессмысленной.
      - name: Эталон распознавания и диаризации
        id: regress
        shell: bash
        run: python scripts/regress.py | tee ../regress.log

      # Условие вместо простого always(): выросший WER не должен прятать
      # результат самих тестов (красным тут могут стать разные вещи, и знать
      # нужно про обе), но если упали зависимости — гонять тесты незачем,
      # они посыплются на импортах и заметут настоящую причину.
      # Сохраняем сразу после загрузки, не дожидаясь исхода тестов. Условие
      # `outcome != skipped` — чтобы не записать в кеш пустую папку, если до
      # загрузки дело не дошло. Если в кеш всё же попадут битые веса (обрыв
      # сети посреди файла), лечится сменой суффикса в ключе на -v2.
      - name: Веса моделей в кеш
        if: always() && steps.models.outputs.cache-hit != 'true' && steps.regress.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: server/data/models
          key: models-macos-gigaam-v3_e2e_rnnt-ecapa-v1

      - name: Медленные уровни (integration + e2e)
        if: success() || steps.regress.conclusion == 'failure'
        run: |
          # Без весов уровень e2e скипается молча (test_e2e_live.py:44): шаг
          # отчитался бы зелёным, выполнив 3 теста из 13. Проверка голосов
          # выше стоит ровно за этим же — не оставлять зелёное «ничего».
          test -d data/models || {
            echo "::error::нет весов моделей — все e2e скипнутся, прогон окажется пустым"
            exit 1
          }
          python -m pytest -m "integration or e2e" -rs

      # Куратор читает GitHub между созвонами: числа прогона должны быть
      # видны на странице проверки, а не в логах на 400 строк.
      - name: Числа эталона в сводку Actions
        if: always()
        run: |
          if [ -f ../regress.log ]; then
            {
              echo '### Эталон распознавания и диаризации'
              echo '```'
              cat ../regress.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
