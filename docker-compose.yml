# Серверная часть Стенографа в контейнерах — сценарий «сервер организации»:
# тяжёлые модели крутятся здесь, сотрудники подключаются лёгким клиентом.
#
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen3:4b   # один раз, скачать LLM
#
# В клиенте (Настройки → Адрес сервера) указать http://<хост>:8765
services:
  server:
    build: ./server
    ports:
      - "8765:8765"
    environment:
      STENOGRAF_DATA_DIR: /data
      STENOGRAF_OLLAMA_URL: http://ollama:11434
      # На слабом сервере можно уменьшить модель: STENOGRAF_ASR_MODEL: base
    volumes:
      - stenograf-data:/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  stenograf-data:
  ollama-models:
