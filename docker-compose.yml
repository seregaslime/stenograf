# Серверная часть Стенографа в контейнерах — сценарий «сервер организации»:
# распознавание речи и хранилище встреч здесь, сотрудники подключаются лёгким
# клиентом.
#
#   docker compose up -d --build
#
# В клиенте: Настройки → Адрес сервера → http://<хост>:8765
# По умолчанию ASR — GigaAM v3 (скачается при первом запуске в том stenograf-data).
#
# Языковой модели здесь нет с 05.09.2026: протокол, подсказки и эмбеддинги
# считает приложение, обращаясь к модели по адресу из своих настроек. У каждого
# он свой — своя машина, свой ключ, свой VPN и свой лимит запросов.
services:
  server:
    build: ./server
    # Имя образа рядом со сборкой намеренно: локально `up --build` собирает и
    # кладёт под этим именем, а на сервере `pull` тянет готовый из реестра —
    # один файл обслуживает оба сценария. Собирать на машине деплоя нельзя:
    # там 1.8 ГБ доступной памяти, а pip ставит torch.
    image: ghcr.io/seregaslime/stenograf-server:latest
    ports:
      - "8765:8765"
    environment:
      STENOGRAF_DATA_DIR: /data
      # Слабый сервер — модель полегче:
      # STENOGRAF_ASR_ENGINE: faster_whisper
      # STENOGRAF_ASR_MODEL: small
    volumes:
      - stenograf-data:/data
    restart: unless-stopped
    # Контейнер играет роль «сервера организации» с известными ресурсами.
    # Лимит нужен и для нагрузочных прогонов: без него контейнер съест всю
    # память хоста, вместо того чтобы честно упереться в потолок.
    # GigaAM + ECAPA занимают ~1.9 ГБ, поэтому 3 ГБ — рабочий минимум.
    mem_limit: 3g

volumes:
  stenograf-data:
